[project]
name = "ytdigest"
version = "0.1.0"
description = "Daily digest of new videos from a list of YouTube channels, pushed to your phone"
authors = [
    { name = "Nick Bitzis", email = "58667322+nickbitzis@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "youtube-transcript-api>=1.2",
]

[project.scripts]
ytdigest = "ytdigest.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
